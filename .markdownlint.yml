# MD FORMATTING

# Default state for all rules
default: true

# Disable 'different heading style' and 'headings should be surrounded by blank lines'
MD003: false

# Disable list indent
MD007: false

MD022: false

# Max line length; MDC inline-component tokens (incl. attribute text)
# are unbreakable and run up to ~155 characters, so the ceiling sits
# well above prose width.
MD013:
  line_length: 160
  code_blocks: false
  tables: false

# Allow duplicated heading for different sections
MD024: false

# Allow multiple top-level headings
MD025: false

# Allow trailing punctuation in "headings"
# (needed for YAML front-matter incorrectly flagged as headings)
MD026: false

# Allow non blank lines around list
MD032: false

# Allow inline HTML
MD033: false

# Allow bare urls
MD034: false

# disable first-line headings
MD041: false

# disable no-alt-text
MD045: false

# Code block style: always fenced.
MD046: fenced

# Use underscores for emphasis (italics)
MD049:
  enabled: true
  style: underscore

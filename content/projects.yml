  - title: "NoSQL App"
    blurb: >-
      A blog server built with a Python frontend and a MongoDB backend. It
      supports registered users posting updates and comments, querying for posts
      and comments, and deleting posts and comments.
    repo: "https://github.com/siavava/nosql"
    tag: "systems"
    year: 2022
    featured: false
  - title: "Particle Simulation"
    blurb: >-
      Using Physics-based simulation to simulate fluid and particle systems. We
      use the SPH method to simulate the Navier Stokes equations for fluids. For
      particles, we use positional indexing to efficiently detect collisions and
      propagate forces between particles.
    repo: "https://github.com/siavava/PhysX/tree/main/proj/a1_mass_spring"
    tag: "visual computing"
    year: 2022
    featured: false
  - title: "Position-Based Dynamics"
    blurb: >-
      Using a position-based system with constraints (instead of the more common
      mass-spring model) to simulate bodies. The method, as described in this
      paper, offers several advantages over the mass-spring model including
      being more generalizable to other scenarios and requiring less computation
      to simulate a body.
    repo: "https://github.com/siavava/PhysX/tree/cleaned-up-proj/proj/a1_mass_spring"
    tag: "visual computing"
    year: 2022
    featured: false
  - title: "Relational Database App"
    blurb: >-
      A relational database with a Python frontend and a MySQL backend,
      including various triggers and SQL automations.
    repo: "https://github.com/siavava/relational"
    tag: "systems"
    year: 2022
    featured: true
  - title: "Rigid Body Simulation"
    blurb: >-
      We use rotational dynamics to simulate a rigid-body helicopter, using
      rotor blades to generate lift and thrust. We use the Euler method to
      numerically integrate the equations of motion.
    repo: "https://github.com/siavava/PhysX/blob/main/proj/a4_multi_copter"
    tag: "visual computing"
    year: 2022
    featured: false
  - title: "Smoke Simulation"
    blurb: >-
      Using Physics-based simulation to simulate a fluid-flow system. We use the
      SPH method to simulate the Navier Stokes equations for smoke. We also
      apply the Vorticity confinement) method to simulate the vorticity) of the
      fluid. To reduce the computational space,we use a grid to store the fluid
      particles.
    repo: "https://github.com/siavava/PhysX/blob/main/proj/a3_grid_fluid"
    tag: "visual computing"
    year: 2022
    featured: false

items:
  - title: "Astronomy Simulations"
    blurb: >-
      A Physics-accurate simulation of mass bodies (stars, planets, etc.) in a
      2D space. The program uses the PyQt5 library to display graphics and
      allows the user to arbitrarily add more bodies to the simulation by
      clicking, adding bigger bodies by holding for longer, etc.
    repo: "https://github.com/siavava/python/tree/main/CS1/LAB/LAB%202/xc"
    tag: "visual computing"
    year: 2020
    featured: false
  - title: "City Demographics"
    blurb: >-
      An interactive program that processes provided raw data about world city
      populations and other important metrics and renders the cities on a map
      highlighting standout locations or other interesting data-points.
    repo: "https://github.com/siavava/python/tree/main/CS1/LAB/LAB%203/XC"
    tag: "data insights"
    year: 2020
    featured: false
  - title: "Pathfinder"
    blurb: >-
      An interactive program that renders locations on a campus map and
      highlights the shortest path between any two points the user clicks on. We
      use breadth-first search to find the shortest path.
    repo: "https://github.com/siavava/python/tree/main/CS1/LAB/LAB%204/XC"
    tag: "data structures and algorithms"
    year: 2020
    featured: false
  - title: "Pong Game"
    blurb: >-
      An interactive GUI game of pong that uses the PyQt5 library to display
      graphics and handles user inputs, detects collisions (for the game), and
      tracks scores as well as the high score in the current streak of games.
    repo: "https://github.com/siavava/python/tree/main/CS1/LAB/LAB%201"
    tag: "visual computing"
    year: 2020
    featured: false
  - title: "Actor Network Semantics"
    blurb: >-
      The infamous Kevin Bacon game; given any two actors, find the shortest
      social connection path between them. We use breadth-first search the
      strategy to find the shortest path in the graph of connections.
    repo: "https://github.com/siavava/java/tree/main/Problem%20Sets/PS-4"
    tag: "data structures and algorithms"
    year: 2021
    featured: false
  - title: "Bash Scripting"
    blurb: >-
      Hacking our way out of various scenarios with bash scripting.
    repo: "https://github.com/siavava/bash"
    tag: "systems"
    year: 2021
    featured: false
  - title: "Cam Paint"
    blurb: >-
      Interactive program that allows the user to draw on a canvas using their
      webcam. The program detects the color of the paintbrush and draws the path
      of the brush on the canvas.
    repo: "https://github.com/siavava/java/tree/main/Problem%20Sets/PS-1"
    tag: "data structures and algorithms"
    year: 2021
    featured: false
  - title: "Collaborative Editor"
    blurb: >-
      A collaborative editor on shared canvas. Multiple users can connect, and
      each sees changes in real-time as they are made. We use mutexes and locks
      to enable concurrent access whilst avoiding data races and deadlock
      pitfalls such as mutual exclusion, hold-and-wait, circular wait, and no
      preemption.
    repo: "https://github.com/siavava/java/tree/main/Problem%20Sets/PS-6"
    tag: "systems"
    year: 2021
    featured: false
  - title: "Command-Line Utilities"
    blurb: >-
      Three different command-line utilities written in C: - chill calculates
      the chill factor of a given temperature and wind speed. - words
      efficiently prints out the words in a file. - histo prints a histogram for
      a stream of numbers.
    repo: "https://github.com/siavava/CS50.2"
    tag: "systems"
    year: 2021
    featured: false
  - title: "Constraint Satisfaction"
    blurb: >-
      Using backtracking and forward-checking to solve constraint satisfaction
      problems such as map coloring and circuit placement. We use heuristics
      such as least-constraining value, most-constraining variable and minimum
      remaining values to intelligently narrow the search space.
    repo: "https://github.com/siavava/ai/tree/main/04-ConstraintSatisfaction"
    tag: "artificial intelligence"
    year: 2021
    featured: false
  - title: "Data Structures"
    blurb: >-
      Efficient implementations of various data structures in C.
    repo: "https://github.com/siavava/CS50.3"
    tag: "data structures and algorithms"
    year: 2021
    featured: false
  - title: "Efficient Spatial Collision Detection"
    blurb: >-
      Program to efficiently detect collisions between blobs in 2D space by
      using quad-trees to partition the space into smaller regions and index
      which blobs are in which region.
    repo: "https://github.com/siavava/java/tree/main/Problem%20Sets/PS-1"
    tag: "data structures and algorithms"
    year: 2021
    featured: false
  - title: "Huffman Coding"
    blurb: >-
      A program that encodes text using a lossless compression algorithm. A
      frequency tree is built from the text. Thereafter, binary codes are
      assigned to each character having the most frequent characters get
      shortest codes.
    repo: "https://github.com/siavava/tau"
    tag: "information theory"
    year: 2021
    featured: false
  - title: "Informed Search"
    blurb: >-
      Using informed search techniques such as A search and Greedy search and
      heuristics such as manhattan distance and euclidean distance to navigate a
      robot through a maze with obstacles to a goal location.
    repo: "https://github.com/siavava/ai/tree/main/02-Mazeworld"
    tag: "artificial intelligence"
    year: 2021
    featured: false
  - title: "Intelligent Chess bot"
    blurb: >-
      A chess bot that uses various strategies including minimax, alpha-beta
      pruning, iterative deepening, transposition tables, move ordering, null-
      move pruning, aspiration windows, and quiescence search to maximize
      outcome against an opponent in chess.
    repo: "https://github.com/siavava/ai/tree/main/03-ChessAI"
    tag: "artificial intelligence"
    year: 2021
    featured: true
  - title: "Logic Algorithms"
    blurb: >-
      Boolean satisfiability is NP-complete, meaning any algorithm that solves
      it takes exponential time &mdash; in fact, any polynomial solution would
      prove P=NP.
    repo: "https://github.com/siavava/ai/tree/main/05-Logic"
    tag: "artificial intelligence"
    year: 2021
    featured: false
  - title: "Logisim Processor"
    blurb: >-
      A fully functional 16-bit CPU implemented in Logisim. All CPU components
      including the ALU, registers, control unit, program counter, RAM, micro-
      sequencer, finite-state machine, and IO are implemented from basic gates.
    repo: "https://github.com/siavava/assembly/tree/main/cs51/practice/hw8"
    tag: "systems"
    year: 2021
    featured: true
  - title: "Neural Networks"
    blurb: >-
      As part of a publication exploring the emergence of and the state of the
      art in machine learning, I implemented neural networks to demonstrate how
      predictions work in the context of simple classification and regression
      problems.
    repo: "https://github.com/siavava/neural"
    tag: "deep learning"
    year: 2021
    featured: false
  - title: "Nuggets Game"
    blurb: >-
      A multiplayer command-line game of nuggets. Players join over web sockets.
      The maze is gradually revealed to each player as they view different
      sectors of it. The game ends when all the nuggets are collected, and the
      player with the most nuggets wins.
    repo: "https://github.com/siavava/tse"
    tag: "systems"
    year: 2021
    featured: false
  - title: "Parts-Of-Speech Tagging"
    blurb: >-
      A bot that uses hidden markov models to tag parts of speech in a sentence.
      We use the viterbi algorithm to generate a sequence of tags for the
      sentence keeping in mind the tag probabilities for each word and the
      transition probabilities between tags.
    repo: "https://github.com/siavava/java/tree/main/Problem%20Sets/PS-5"
    tag: "artificial intelligence"
    year: 2021
    featured: false
  - title: "Robot Colocation"
    blurb: >-
      A common problem in robotics is localizing a robot in a novel environment
      given sensor readings. This project uses hidden markov models and the
      forward-backward algorithm and the viterbi algorithm to decipher where a
      robot's situation probabilities in a maze, given a sequence of sensor
      readings from the robot.
    repo: "https://github.com/siavava/ai/tree/main/06-HiddenMarkovModels"
    tag: "artificial intelligence"
    year: 2021
    featured: false
  - title: "Tiny Search Engine"
    blurb: >-
      A hyper-efficient search engine that crawls webpages (whose domain can be
      restricted to a given subset) and indexes them, then handles user queries
      on the contents of the collection of pages, with results ranked by
      frequency. It also supports query modifiers such as AND, OR, and NOT.
    repo: "https://github.com/siavava/tse"
    tag: "systems"
    year: 2021
    featured: true
  - title: "Uninformed Search"
    blurb: >-
      Using uninformed search algorithms such as breadth-first search and depth-
      first search to search the solution space for elementary problems such as
      the :chicken: and :dog: problem (we wish to get x chicken and y foxes
      across a crossway with limited carriage capacity without leaving any
      chicken unattended with the foxes\u2026
    repo: "https://github.com/siavava/ai/tree/main/01-SearchProblems"
    tag: "artificial intelligence"
    year: 2021
    featured: false
  - title: "Gradient Descent"
    blurb: >-
      Using regression models to classify provided data. The models are not pre-
      trained, se we use gradient descent to find the optimal parameters for the
      model.
    repo: "https://github.com/siavava/ml/blob/main/HW1/HW1_cosc74.ipynb"
    tag: "machine learning"
    year: 2022
    featured: false
  - title: "Hair Strand Simulation"
    blurb: >-
      Using Physics-based simulation to animate a hair strand using connection
      and bending constraints. The simulation is implemented in C++ using the
      OpenGL framework.
    repo: "https://github.com/siavava/PhysX/tree/main/proj/a1_mass_spring"
    tag: "visual computing"
    year: 2022
    featured: false

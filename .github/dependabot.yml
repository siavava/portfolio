version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "(deps)"
    cooldown:
      default-days: 3
    # typescript 7 dropped the JS compiler API that vue-tsc and
    # typescript-eslint load; lift this once both run on it
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # first matching group wins, so the toolchain stays ahead of the catch-all
    groups:
      purescript:
        patterns: ["purescript", "spago", "purs-tidy"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
